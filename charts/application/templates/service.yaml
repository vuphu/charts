apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    {{- range $index, $port := required "service.ports must contain at least one port" .Values.service.ports }}
    - name: {{ default (printf "port-%d" $index) $port.name | quote }}
      protocol: {{ default "TCP" $port.protocol }}
      port: {{ $port.port }}
      targetPort: {{ default $port.port $port.targetPort }}
    {{- end }}
